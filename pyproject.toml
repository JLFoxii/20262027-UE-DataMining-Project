[project]
name = "ue-data-mining-project"
version = "0.1.0"
description = "Projet de Data Mining M2IA/M2DS 2026-2027"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.0,<5",
    "matplotlib>=3.8,<4",
    "mlxtend>=0.23,<0.24",
    "networkx>=3.3,<4",
    "nltk>=3.8,<4",
    "notebook>=7.0,<8",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "rapidfuzz>=3.9,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.11,<2",
    "seaborn>=0.13,<1",
    "unidecode>=1.3,<2",
]

[tool.uv]
# document_analysis.py is imported directly from the project root.
package = false
